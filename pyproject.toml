[project]
name = "msksweb"
version = "0.1.0"
description = "FastAPI/Pydantic web client for the msks microvm workspace daemon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.5",
  "pydantic-settings>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.scripts]
msksweb = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
